<head>

<title>Ingresar · Ventas Febeca</title>
<style>
/* Valores de diseño iguales a los del dashboard en Claude (tema claro y oscuro). */
:root {
  --color-bad: rgb(142, 38, 38);
  --color-fg: rgb(11, 11, 11);
  --color-ok: rgb(0, 99, 0);
  --color-bg: rgb(249, 249, 247);
  --color-border-line: rgba(11, 11, 11, 0.1);
  --color-fg-muted: rgb(137, 135, 129);
  --color-panel: rgb(255, 255, 255);
  --color-warn: rgb(115, 69, 0);
  --cds-border: rgba(11, 11, 11, 0.1);
  --cds-chart-axis: rgb(195, 194, 183);
  --cds-chart-grid: rgba(11, 11, 11, 0.1);
  --cds-chart-muted: rgb(195, 194, 183);
  --cds-chart-reference: rgb(137, 135, 129);
  --cds-dur-slow: .45s;
  --cds-ease-out: cubic-bezier(.165, .84, .44, 1);
  --cds-font-size-body: 14px;
  --cds-font-size-caption: 12px;
  --cds-font-size-heading: 15px;
  --cds-font-size-title: 22px;
  --cds-font-weight-medium: 500;
  --cds-gap-lg: 28px;
  --cds-gap-md: 16px;
  --cds-gap-sm: 12px;
  --cds-gap-xs: 8px;
  --cds-gap-xl: 40px;
  --cds-pad-lg: 16px;
  --cds-pad-md: 12px;
  --cds-pad-sm: 8px;
  --cds-pad-xs: 6px;
  --cds-pad-xl: 24px;
  --cds-radius: 8px;
  --cds-shadow-popover: 0 8px 24px #0000001f, 0 2px 6px #00000014;
  --cds-surface-popover: rgb(255, 255, 255);
  --cds-text-secondary: rgb(82, 81, 78);
  --cds-page-bg: rgb(249, 249, 247);
  --cds-text-primary: rgb(11, 11, 11);
  --cds-chart-categorical-1: rgb(42, 120, 214);
  --cds-chart-categorical-2: rgb(235, 104, 52);
  --cds-chart-categorical-3: rgb(27, 175, 122);
  --cds-chart-categorical-4: rgb(237, 161, 0);
  --cds-chart-categorical-5: rgb(232, 123, 164);
  --cds-chart-categorical-6: rgb(0, 131, 0);
  --cds-chart-categorical-7: rgb(98, 80, 214);
  --cds-chart-categorical-8: rgb(227, 73, 72);
  --font-anthropic-sans: "Anthropic Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-anthropic-serif: "Anthropic Serif", ui-serif, Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --color-bad: rgb(236, 126, 126);
  --color-fg: rgb(240, 239, 236);
  --color-ok: rgb(12, 163, 12);
  --color-bg: rgb(11, 11, 11);
  --color-border-line: rgba(255, 255, 255, 0.1);
  --color-fg-muted: rgb(137, 135, 129);
  --color-panel: rgb(26, 26, 25);
  --color-warn: rgb(219, 147, 0);
  --cds-border: rgba(255, 255, 255, 0.1);
  --cds-chart-axis: rgb(56, 56, 53);
  --cds-chart-grid: rgba(255, 255, 255, 0.1);
  --cds-chart-muted: rgb(95, 94, 90);
  --cds-chart-reference: rgb(151, 149, 141);
  --cds-shadow-popover: 0 8px 24px #00000052, 0 2px 6px #0003;
  --cds-surface-popover: rgb(32, 32, 31);
  --cds-text-secondary: rgb(195, 194, 183);
  --cds-page-bg: rgb(11, 11, 11);
  --cds-text-primary: rgb(240, 239, 236);
  --cds-chart-categorical-1: rgb(57, 135, 229);
  --cds-chart-categorical-2: rgb(217, 89, 38);
  --cds-chart-categorical-3: rgb(25, 158, 112);
  --cds-chart-categorical-4: rgb(201, 133, 0);
  --cds-chart-categorical-5: rgb(213, 81, 129);
  --cds-chart-categorical-6: rgb(0, 131, 0);
  --cds-chart-categorical-7: rgb(144, 133, 233);
  --cds-chart-categorical-8: rgb(230, 103, 103);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-bad: rgb(236, 126, 126);
  --color-fg: rgb(240, 239, 236);
  --color-ok: rgb(12, 163, 12);
  --color-bg: rgb(11, 11, 11);
  --color-border-line: rgba(255, 255, 255, 0.1);
  --color-fg-muted: rgb(137, 135, 129);
  --color-panel: rgb(26, 26, 25);
  --color-warn: rgb(219, 147, 0);
  --cds-border: rgba(255, 255, 255, 0.1);
  --cds-chart-axis: rgb(56, 56, 53);
  --cds-chart-grid: rgba(255, 255, 255, 0.1);
  --cds-chart-muted: rgb(95, 94, 90);
  --cds-chart-reference: rgb(151, 149, 141);
  --cds-shadow-popover: 0 8px 24px #00000052, 0 2px 6px #0003;
  --cds-surface-popover: rgb(32, 32, 31);
  --cds-text-secondary: rgb(195, 194, 183);
  --cds-page-bg: rgb(11, 11, 11);
  --cds-text-primary: rgb(240, 239, 236);
  --cds-chart-categorical-1: rgb(57, 135, 229);
  --cds-chart-categorical-2: rgb(217, 89, 38);
  --cds-chart-categorical-3: rgb(25, 158, 112);
  --cds-chart-categorical-4: rgb(201, 133, 0);
  --cds-chart-categorical-5: rgb(213, 81, 129);
  --cds-chart-categorical-6: rgb(0, 131, 0);
  --cds-chart-categorical-7: rgb(144, 133, 233);
  --cds-chart-categorical-8: rgb(230, 103, 103);
  color-scheme: dark;
}

*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.45; }
.lg { width: min(100%, 24rem); display: grid; gap: var(--cds-gap-lg); }
.lg-marca { display: grid; justify-items: center; gap: var(--cds-gap-xs); }
.lg-marca img { width: 9.5rem; height: auto; display: block; }
.lg-by { font-size: var(--cds-font-size-caption); letter-spacing: .08em; color: var(--color-fg-muted); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 1px var(--cds-pad-sm); }
.lg-titulo { text-align: center; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: calc(var(--cds-font-size-title) * 1.6); line-height: 1.05; text-shadow: 0 2px 6px color-mix(in srgb, var(--color-fg) 28%, transparent), 0 1px 0 color-mix(in srgb, var(--color-fg) 18%, transparent); }
.lg-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xl); display: grid; gap: var(--cds-gap-md); }
.lg-card h1 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.lg-campo { display: grid; gap: var(--cds-gap-xs); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.lg-campo input { font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-sm) var(--cds-pad-md); min-height: 2.5rem; }
.lg-campo input:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
.lg-btn { font: inherit; font-weight: var(--cds-font-weight-medium); color: var(--color-bg); background: var(--color-fg); border: 0; border-radius: 999px; padding: var(--cds-pad-sm) var(--cds-pad-lg); min-height: 2.5rem; cursor: pointer; }
.lg-btn:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.lg-btn[disabled] { opacity: .6; cursor: default; }
.lg-msg { font-size: var(--cds-font-size-caption); min-height: 1.2em; }
.lg-msg.mal { color: var(--color-bad); }
.lg-msg.bien { color: var(--color-ok); }
.lg-pie { text-align: center; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
</style>
</head>

    <label class="lg-campo">Clave<input name="clave" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="volver" id="lg-volver" value="/">
    <button class="lg-btn" type="submit" id="lg-b">Ingresar</button>
    <p class="lg-msg" id="lg-msg" aria-live="polite"></p>
  </form>
  <p class="lg-pie">Acceso solo para el equipo de Febeca.<br><a href="/" style="color:inherit;text-decoration:underline;text-underline-offset:2px">Volver al dashboard</a></p>
</main>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById('lg-msg');
  if (p.get('volver')) document.getElementById('lg-volver').value = p.get('volver');
  if (p.get('u')) document.getElementById('lg-u').value = p.get('u');
  const e = p.get('error');
  if (e === 'config') { msg.textContent = 'Falta configurar los usuarios en Vercel (DASH_USERS y DASH_SECRET).'; msg.className = 'lg-msg mal'; }
  else if (e) { msg.textContent = 'Usuario o clave incorrectos.'; msg.className = 'lg-msg mal'; }
  else if (p.get('salio')) { msg.textContent = 'Cerraste la sesión.'; msg.className = 'lg-msg bien'; }
  (p.get('u') ? document.querySelector('[name=clave]') : document.getElementById('lg-u')).focus();
  document.getElementById('lg-form').addEventListener('submit', () => { const b = document.getElementById('lg-b'); b.disabled = true; b.textContent = 'Ingresando…'; });
})();
</script>
</body>
</html>
